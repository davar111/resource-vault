<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <title>Resource Vault</title>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__top">
          <div class="brand-row">
            <div id="brand" class="brand">Vault</div>
            <div class="lang">
              <button id="langRu" class="lang__btn" type="button">RU</button>
              <button id="langEn" class="lang__btn" type="button">EN</button>
            </div>
            <button id="btnMobileClose" class="btn btn--secondary btn--icon mobile-close-btn" type="button" aria-label="Close menu"><span class="btn-icon-cross">×</span></button>
          </div>

          <div class="sidebar__section">
            <div class="sidebar__label" id="labelNav">Navigation</div>
            <div class="sidebar__stack">
              <button id="navAll" class="nav-item" type="button">All links</button>
              <button id="navFav" class="nav-item" type="button">Favorites</button>
            </div>
          </div>

          <div class="sidebar__section">
            <div class="sidebar__section-head">
              <div class="sidebar__label" id="labelCollections">Collections</div>
              <button id="btnNewCollection" class="btn btn--secondary btn--icon" type="button" aria-label="New collection">+</button>
            </div>
            <nav id="collectionsList" class="collections"></nav>
          </div>
        </div>

        <div class="sidebar__bottom sidebar__bottom--stack">
          <button id="btnAddLink" class="btn btn--primary" type="button">+ Add link</button>

          <div class="settings">
            <button id="btnSettings" class="btn btn--ghost" type="button">Settings</button>
            <div id="settingsMenu" class="settings__menu" hidden>
              <button id="btnExport" class="settings__item" type="button">Export JSON</button>
              <button id="btnImport" class="settings__item" type="button">Import JSON</button>
              <input id="fileImport" type="file" accept="application/json" hidden />
            </div>
          </div>

          <div id="localHint" class="hint">Данные хранятся локально в браузере (localStorage).</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__left">
            <button id="btnMobileMenu" class="btn btn--secondary btn--icon mobile-menu-btn" type="button" aria-label="Open menu"><span class="mobile-menu-btn__icon"><span></span><span></span></span></button>
            <div id="activeTitle" class="title">All links</div>
            <div id="activeMeta" class="meta"></div>
          </div>

          <div class="topbar__right">
            <input id="searchInput" class="search" placeholder="Search in current context..." />
            <button id="btnFilters" class="btn btn--secondary" type="button">Filters</button>
            <select id="sortSelect" class="sort" aria-label="Sort">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="title_asc">Title A-Z</option>
              <option value="title_desc">Title Z-A</option>
              <option value="source_asc">By source</option>
            </select>
          </div>
        </header>

        <section id="filtersPanel" class="filters-panel" hidden>
          <div class="filters-grid">
            <fieldset class="field multi">
              <legend id="labelFilterTypes">Types</legend>
              <div class="multi__chips" id="filterTypes"></div>
            </fieldset>

            <fieldset class="field multi">
              <legend id="labelFilterSources">Sources</legend>
              <div class="multi__chips" id="filterSources"></div>
            </fieldset>

            <label class="field">
              <span id="labelFilterTag">Tag contains</span>
              <input id="filterTagInput" placeholder="fintech" />
            </label>

            <label class="check">
              <input id="filterFavoriteOnly" type="checkbox" />
              <span id="labelFilterFavorite">Only favorites</span>
            </label>
          </div>
        </section>

        <section class="chipsbar">
          <div id="activeFilters" class="chips"></div>
        </section>

        <section id="grid" class="grid"></section>
      </main>
    </div>
    <div id="mobileOverlay" class="mobile-overlay" aria-hidden="true"></div>

    <dialog id="modalAddLink" class="modal">
      <form method="dialog" class="modal__card" id="formAddLink">
        <div class="modal__header">
          <div id="modalAddTitle" class="modal__title">Add link</div>
          <button id="addCloseX" class="btn btn--icon btn--ghost" type="button" aria-label="Close"><span class="btn-icon-cross">×</span></button>
        </div>

        <div class="modal__section">
          <label class="field">
            <span id="labelAddUrl">URL</span>
            <input name="url" required placeholder="https://..." />
          </label>

          <label class="field">
            <span id="labelAddTitle">Title</span>
            <input id="inputAddTitle" name="title" placeholder="Optional" />
          </label>
        </div>

        <div class="modal__section">
          <div id="labelAddTo" class="modal__section-title">Add to</div>
          <div id="addCollectionsList" class="multi__chips"></div>
          <label class="check">
            <input id="addFavorite" type="checkbox" name="favorite" />
            <span id="labelAddFavorite">Mark as favorite</span>
          </label>
        </div>

        <div class="modal__section">
          <div id="sectionAddClassify" class="modal__section-title">Classification</div>
          <label class="field">
            <span id="labelAddTags">Tags (comma)</span>
            <input id="inputAddTags" name="tags" list="addTagsSuggestions" placeholder="dark, fintech" />
            <datalist id="addTagsSuggestions"></datalist>
          </label>

          <div class="row">
            <label class="field">
              <span id="labelAddType">Type</span>
              <select name="type">
                <option value="">Any</option>
                <option value="Project">Project</option>
                <option value="Studio">Studio</option>
                <option value="Designer">Designer</option>
                <option value="Inspiration">Inspiration</option>
                <option value="Source">Source</option>
              </select>
            </label>

            <label id="addSourceField" class="field">
              <span id="labelAddSource">Source</span>
              <select id="inputAddSource" name="source">
                <option value="Other">Other</option>
                <option value="Site">Site</option>
                <option value="Behance">Behance</option>
                <option value="Awwwards">Awwwards</option>
                <option value="Pinterest">Pinterest</option>
                <option value="Dribbble">Dribbble</option>
              </select>
            </label>
          </div>
          <div id="addSourceAuto" class="hint" hidden></div>
        </div>

        <div class="modal__section">
          <label class="field">
            <span id="labelAddNote">Note</span>
            <textarea id="inputAddNote" name="note" rows="3" placeholder="Why saved?"></textarea>
          </label>
        </div>

        <div class="row row--end">
          <button id="addCancel" class="btn btn--secondary" type="button">Cancel</button>
          <button id="addSave" class="btn btn--primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="modalCollection" class="modal">
      <form method="dialog" class="modal__card" id="formCollection">
        <div class="modal__header">
          <div id="modalCollectionTitle" class="modal__title">Create collection</div>
          <button id="colCloseX" class="btn btn--icon btn--ghost" type="button" aria-label="Close"><span class="btn-icon-cross">×</span></button>
        </div>

        <label class="field">
          <span id="labelColName">Name</span>
          <input name="name" required placeholder="Dark Fintech Landings" />
        </label>

        <label class="field">
          <span id="labelColDescription">Description</span>
          <input name="description" placeholder="Optional short description" />
        </label>

        <div class="field">
          <span id="labelCollectionKind">Collection type</span>
          <div class="kind-toggle">
            <label class="chip-check">
              <input id="kindManual" type="radio" name="kind" value="manual" checked />
              <span id="labelKindManual">Manual</span>
            </label>
            <label class="chip-check">
              <input id="kindSmart" type="radio" name="kind" value="smart" />
              <span id="labelKindSmart">Smart</span>
            </label>
          </div>
        </div>

        <div id="collectionRules" class="modal__section" hidden>
          <div id="sectionColRules" class="modal__section-title">Collection rules</div>
          <div id="smartHint" class="hint">This is a dynamic view based on rules.</div>

          <div class="row">
            <fieldset class="field multi">
              <legend id="labelColTypes">Types</legend>
              <div class="multi__chips" id="colTypesChips"></div>
            </fieldset>

            <fieldset class="field multi">
              <legend id="labelColSources">Sources</legend>
              <div class="multi__chips" id="colSourcesChips"></div>
            </fieldset>
          </div>

          <label class="field">
            <span id="labelColAllTags">All tags (required)</span>
            <input id="inputColAllTags" name="requiredTags" placeholder="dark, fintech" />
          </label>

          <label class="field">
            <span id="labelColAnyTags">Any tag (at least one)</span>
            <input id="inputColAnyTags" name="anyTags" placeholder="landing, typography" />
          </label>

          <label class="field">
            <span id="labelColQuery">Contains text</span>
            <input id="inputColQuery" name="containsText" placeholder="saas, serif, motion" />
          </label>

          <label class="check">
            <input type="checkbox" name="onlyFavorites" />
            <span id="labelColFavOnly">Only favorites</span>
          </label>
        </div>

        <div class="row row--end">
          <button id="colCancel" class="btn btn--secondary" type="button">Cancel</button>
          <button id="colCreate" class="btn btn--primary" type="submit">Create</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
